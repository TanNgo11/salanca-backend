packages:
  - '.'
allowBuilds:
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@tanngo11/log@0.4.6'

# One sharp (and one libvips) per process: Strapi's upload plugin pins an
# older sharp, and two libvips builds loaded together crash image uploads.
overrides:
  sharp: 0.35.4

# TEMP until 2026-10-10 07:10 UTC: pnpm 11.7 ignores minimumReleaseAgeExclude when it
# verifies the lockfile, so @tanngo11/log@0.5.1 (published 2026-10-09) fails every install.
# Remove this line after that time to restore the default 1-day release age.
minimumReleaseAge: 0
