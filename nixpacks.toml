# Nixpacks' default corepack-activated pnpm crashes with
# ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING regardless of Node major version.
# `npm install -g` bypasses corepack entirely (npm's own global install
# mechanism, no dynamic-import shim) and — unlike an ephemeral `npx pnpm@...`
# call — leaves `pnpm` on PATH at 11.7.0 for later manual container shells too.
# Keep this version aligned with package.json's packageManager field.
[phases.install]
cmds = [
  "npm install -g pnpm@11.7.0",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "node node_modules/@strapi/strapi/bin/strapi.js start"
