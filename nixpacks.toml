# Invoke the pinned CLI explicitly: Nixpacks' default corepack-based pnpm
# invocation breaks under Node 24 with ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING.
# Same fix as batdongsan-cms/backend-bds/nixpacks.toml.
# Keep this version aligned with package.json's packageManager field.
[phases.install]
cmds = [
  "npx --yes pnpm@11.7.0 --version",
  "npx --yes pnpm@11.7.0 install --frozen-lockfile",
]

[phases.build]
cmds = ["npx --yes pnpm@11.7.0 run build"]

[start]
cmd = "node node_modules/@strapi/strapi/bin/strapi.js start"
